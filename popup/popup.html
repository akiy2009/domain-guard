<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Domain Guard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <span>Domain Guard</span>
    </div>
    <button id="btn-settings" class="icon-btn" type="button" title="設定を開く" aria-label="設定を開く">⚙</button>
  </header>

  <main>
    <section id="card-verdict" class="verdict" aria-live="polite">
      <div id="verdict-icon" class="verdict-icon" aria-hidden="true">…</div>
      <div class="verdict-text">
        <div id="verdict-label" class="verdict-label">解析中…</div>
        <div id="verdict-host" class="verdict-host"></div>
      </div>
      <div id="verdict-score" class="verdict-score" hidden>
        <span id="score-num">0</span><span class="score-unit">/100</span>
      </div>
    </section>

    <div class="meter" aria-hidden="true"><div id="meter-fill" class="meter-fill"></div></div>

    <p id="checked-at" class="checked-at" hidden></p>

    <section id="host-info" class="host-info" hidden>
      <div class="host-row">
        <span class="host-key">表示ドメイン</span>
        <span id="host-display" class="host-val mono"></span>
      </div>
      <div class="host-row">
        <span class="host-key">登録ドメイン</span>
        <span id="host-registered" class="host-val mono"></span>
      </div>
      <div id="host-puny-row" class="host-row" hidden>
        <span class="host-key">実際の表記</span>
        <span id="host-actual" class="host-val mono warn-text"></span>
      </div>
    </section>

    <section id="findings-wrap" class="findings-wrap" hidden>
      <h2>検出結果 <span id="findings-count" class="count-badge">0</span></h2>
      <ul id="findings" class="findings"></ul>
    </section>

    <section id="empty-state" class="empty" hidden>
      <p>このページでは問題は見つかりませんでした。</p>
    </section>

    <section id="notice" class="notice" role="status" hidden></section>

    <div class="actions">
      <button id="btn-whitelist" class="btn btn-ghost" type="button" hidden></button>
      <button id="btn-recheck" class="btn btn-secondary" type="button">再解析</button>
    </div>

    <p id="report-wrap" class="report" hidden>
      <a id="report-link" href="#" target="_blank" rel="noopener noreferrer">このサイトを Google に報告する</a>
    </p>

    <p class="disclaimer">
      判定結果はヒューリスティック解析による目安です。最終的な判断はご自身で行ってください。
    </p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
