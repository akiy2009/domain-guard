name: Feature request
description: 機能追加・改善の提案
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような場面で困っていますか？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      options:
        - 検知ルール
        - ブランド辞書
        - ポップアップ
        - 設定画面
        - 警告ページ
        - プライバシー / 権限
        - ドキュメント / 開発
        - その他
  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存の Issue を検索した
          required: true
