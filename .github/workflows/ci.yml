name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check and tests
        run: npm run check

      - name: Build store ZIP
        if: matrix.node == 22
        run: npm run build

      - name: Upload ZIP
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: domain-guard-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
